<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<rect width="1400" height="980" fill="#f7f4ec"/>
<text x="40" y="44" font-family="Archivo, Inter, sans-serif" font-size="24" font-weight="700" fill="#1c1a17">D8. DATUM valuation DAG</text>
<text x="40" y="68" font-family="Archivo, Inter, sans-serif" font-size="13" fill="#6b655a">The model emits facts. Deterministic Python emits dollars. The LLM structurally cannot emit a price.</text>
<rect x="40" y="80" width="1320" height="1" fill="#a67c00"/>
<text x="40" y="962" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b655a">NRH-DT-DAG-001 (new Nov 2026)  |  NEURUH CODEX v1.1.0  |  2026-11-10  |  Every number carries an audit date.</text>
<rect x="40" y="100" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="100" width="4" height="62" rx="2" fill="#a67c00"/>
<text x="56" y="124" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 0.5  JURISDICTION RESOLVER</text>
<text x="56" y="144" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Returns an authority map, not a jurisdiction. Zoning, septic, drainage, floodplain, wetlands, assessment each resolve to a different body.</text>
<line x1="100" y1="162" x2="100" y2="174" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,166 105,166 100,174" fill="#a67c00"/>
<rect x="40" y="174" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="174" width="4" height="62" rx="2" fill="#a67c00"/>
<text x="56" y="198" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 0  SUBJECT RESOLUTION</text>
<text x="56" y="218" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Deterministic. Which parcel, which record, which authority, pinned by date.</text>
<line x1="100" y1="236" x2="100" y2="248" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,240 105,240 100,248" fill="#a67c00"/>
<rect x="40" y="248" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="248" width="4" height="62" rx="2" fill="#a67c00"/>
<text x="56" y="272" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 1  FACT EXTRACTION</text>
<text x="56" y="292" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">The only genuinely parallel layer. Regulatory, infrastructure, physical, market pullers hit different sources.</text>
<line x1="100" y1="310" x2="100" y2="322" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,314 105,314 100,322" fill="#a67c00"/>
<rect x="40" y="322" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="322" width="4" height="62" rx="2" fill="#b3261e"/>
<text x="56" y="346" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 2  FEASIBILITY SOLVER</text>
<text x="56" y="366" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">The only layer allowed to state what is buildable. Regulatory, infrastructure, soils resolve here. Double-counting dies here.</text>
<line x1="100" y1="384" x2="100" y2="396" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,388 105,388 100,396" fill="#a67c00"/>
<rect x="40" y="396" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="396" width="4" height="62" rx="2" fill="#a67c00"/>
<text x="56" y="420" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 3  SUBTYPE ROUTER</text>
<text x="56" y="440" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Selects the pricing engine.</text>
<line x1="100" y1="458" x2="100" y2="470" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,462 105,462 100,470" fill="#a67c00"/>
<rect x="40" y="470" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="470" width="4" height="62" rx="2" fill="#a67c00"/>
<text x="56" y="494" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 4  VALUATION ENGINES</text>
<text x="56" y="514" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Pure Python. No LLM arithmetic. Re-run last month's valuation from the cached feature vector, byte-identical.</text>
<line x1="100" y1="532" x2="100" y2="544" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,536 105,536 100,544" fill="#a67c00"/>
<rect x="40" y="544" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="544" width="4" height="62" rx="2" fill="#a67c00"/>
<text x="56" y="568" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 5  CALIBRATION</text>
<text x="56" y="588" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Versioned JSON coefficients, geography x subtype x YEAR, hash-stamped.</text>
<line x1="100" y1="606" x2="100" y2="618" stroke="#a67c00" stroke-width="2"/>
<polygon points="95,610 105,610 100,618" fill="#a67c00"/>
<rect x="40" y="618" width="860" height="62" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="618" width="4" height="62" rx="2" fill="#8a6d00"/>
<text x="56" y="642" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LAYER 6  RECONCILER</text>
<text x="56" y="662" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Fires only when engines disagree beyond a threshold. LLM judgment with the disagreement explicit, never averaged away.</text>
<rect x="940" y="100" width="420" height="260" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="940" y="100" width="4" height="260" rx="2" fill="#a67c00"/>
<text x="956" y="124" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LABEL TIERS</text>
<text x="956" y="144" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Tier 0: hard labels, recorded sales (SDF).</text>
<text x="956" y="162" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Tier 1: sales-ratio study (COD, PRD).</text>
<text x="956" y="180" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Tier 2: market signals (list, DOM, withdrawals).</text>
<text x="956" y="198" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Tier 3: own offer outcomes (censored, unreplicable).</text>
<text x="956" y="216" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Tier 4: founder judgment (structure, then decays).</text>
<text x="956" y="234" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Trust: Tier 0 drives the fit, Tier 3 eventually dominates.</text>
<rect x="940" y="380" width="420" height="220" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="940" y="380" width="4" height="220" rx="2" fill="#2e7d32"/>
<text x="956" y="404" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">THE LLM / PYTHON SEAM</text>
<text x="956" y="424" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Model emits: facts with evidence refs,</text>
<text x="956" y="442" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">categorical judgments (closed enums),</text>
<text x="956" y="460" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">ordinal judgments (bounded scales),</text>
<text x="956" y="478" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">probabilities (0-1, separately calibrated),</text>
<text x="956" y="496" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">abstention (null + evidence gap, first-class).</text>
<text x="956" y="514" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">No dollar field exists in its output schema.</text>
<rect x="940" y="620" width="420" height="150" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="940" y="620" width="4" height="150" rx="2" fill="#2e7d32"/>
<text x="956" y="644" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">TIER 0, RESOLVED (JUL 25)</text>
<text x="956" y="664" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Indiana SDF: free download, UTF-16LE,</text>
<text x="956" y="682" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">price /100, acreage /10000, per-SDF_ID.</text>
<text x="956" y="700" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">St. Joseph 2024: 5,841 records, 2,262 Tier 0.</text>
<text x="956" y="718" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">One $7.4B outlier quarantined (see II.6).</text>
<text x="40" y="810" font-family="Archivo, Inter, sans-serif" font-size="12.5" font-style="italic" fill="#6b655a">Figure D8. DATUM DAG. Loss: asymmetric pinball, overestimation penalized about 3:1 (config). Fit P10/P50/P90, not a point estimate.</text>
<text x="40" y="834" font-family="Archivo, Inter, sans-serif" font-size="12.5" font-style="italic" fill="#6b655a">Repo: NeuruhAI/datum, v0.4.0 (07184f5, Jul 26, 2026). Indiana first, Michigan second. Q-002 (offer history) still open.</text>
</svg>