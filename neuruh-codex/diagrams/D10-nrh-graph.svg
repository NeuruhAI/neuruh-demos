<text x="40" y="44" font-family="Archivo, Inter, sans-serif" font-size="24" font-weight="700" fill="#1c1a17">D10. NRH Registry graph</text>
<text x="40" y="68" font-family="Archivo, Inter, sans-serif" font-size="13" fill="#6b655a">The addressing spine. Every artifact in the operation, one address space, hash-chained transitions.</text>
<rect x="40" y="80" width="1320" height="1" fill="#a67c00"/>
<text x="40" y="802" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b655a">NRH-RG-GRAPH-001 (new Nov 2026)  |  NEURUH CODEX v1.1.0  |  2026-11-10  |  Every number carries an audit date.</text>
<rect x="40" y="110" width="1320" height="100" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="110" width="4" height="100" rx="2" fill="#a67c00"/>
<text x="56" y="134" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">ONE ADDRESS SPACE</text>
<text x="56" y="154" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">NRH-[DD]-[ENT]-[TTT]-[NNN]  |  EXAMPLE: NRH-RE-LOS-REP-001 (Real Estate domain, LandOS entity, Repository type, first instance).</text>
<text x="56" y="172" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Resolvable, sortable, collision-free, human-legible. SQLite, WAL journal mode. stdlib Python CLI, zero pip dependencies.</text>
