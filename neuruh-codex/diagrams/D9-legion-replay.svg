<text x="40" y="44" font-family="Archivo, Inter, sans-serif" font-size="24" font-weight="700" fill="#1c1a17">D9. LEGION governed swarm, replay</text>
<text x="40" y="68" font-family="Archivo, Inter, sans-serif" font-size="13" fill="#6b655a">10,000 governed workers on a shared thread pool. Deterministic replay with receipts, not swarm intelligence.</text>
<rect x="40" y="80" width="1320" height="1" fill="#a67c00"/>
<text x="40" y="802" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b655a">NRH-LG-REPLAY-001 (new Nov 2026)  |  NEURUH CODEX v1.1.0  |  2026-11-10  |  Every number carries an audit date.</text>
