<text x="56" y="134" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">SUPERVISOR</text>
<text x="56" y="154" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">One supervisor takes an exclusive lock.</text>
<text x="56" y="172" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">HALT file checked before start and every dispatch.</text>
<text x="56" y="190" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Journal re-verified before resume; broken link halts.</text>
<text x="56" y="208" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Agents read only, cannot spawn, contact NOT_AUTHORIZED.</text>
