<text x="56" y="344" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">THE RUN (RECORDED 2026-09-28)</text>
<text x="56" y="364" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Run id legion-8b4fcca041981a3af08a6331. 130 squads, 7 cohorts.</text>
<text x="56" y="382" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">387 tests pass, 25 of them LEGION's.</text>
<text x="56" y="400" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">PR #26 merged 2026-09-30 (dbd9ef6).</text>
<text x="56" y="418" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Proof tag legion-v0.1.0-proof-20260928 at 8719d8d.</text>
<rect x="720" y="320" width="640" height="170" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="720" y="320" width="4" height="170" rx="2" fill="#8a6d00"/>
<text x="736" y="344" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">HONEST SCORECARD</text>
<text x="736" y="364" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Each agent is a deterministic scoring unit. No LLM in the loop.</text>
<text x="736" y="382" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">10,000 identical scorers is parallel processing with receipts.</text>
<text x="736" y="400" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Rare parts: deterministic replay, sealed roll-up,</text>
<text x="736" y="418" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">builder-separate-from-judge, limits enforced in code.</text>
<rect x="40" y="530" width="1320" height="120" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="530" width="4" height="120" rx="2" fill="#a67c00"/>
<text x="56" y="554" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">LIVE REPLAY</text>
<text x="56" y="574" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Viewer: neuruhai.github.io/neuruh-demos/legion-replay/ (34,116 B, 87 DOM checks, shipped 2026-11-10).</text>
<text x="56" y="592" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">7 cohort clusters, 130 squad nodes, 6,487 tier-shaped agents, sealed FINAL_OUTPUT core. Layout derived, not recorded telemetry.</text>
<text x="56" y="610" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">LEGION-LIVE (:8620/:8621) is specified, not built. Until then, any live swarm visual is a replay and must be labeled as one.</text>
<text x="40" y="690" font-family="Archivo, Inter, sans-serif" font-size="12.5" font-style="italic" fill="#6b655a">Figure D9. LEGION replay. LEGION is a job, not a service. It runs for seconds and exits.</text>
</svg>