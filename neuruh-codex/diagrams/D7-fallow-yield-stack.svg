<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<rect width="1400" height="900" fill="#f7f4ec"/>
<text x="40" y="44" font-family="Archivo, Inter, sans-serif" font-size="24" font-weight="700" fill="#1c1a17">D7. FALLOW yield stack</text>
<text x="40" y="68" font-family="Archivo, Inter, sans-serif" font-size="13" fill="#6b655a">Dual-engine land-yield venture. Engine A executes leases; Engine B sells the intelligence Engine A produces.</text>
<rect x="40" y="80" width="1320" height="1" fill="#a67c00"/>
<text x="40" y="882" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b655a">NRH-FL-STACK-001 (new Nov 2026)  |  NEURUH CODEX v1.1.0  |  2026-11-10  |  Every number carries an audit date.</text>
<rect x="40" y="100" width="1320" height="26" rx="4" fill="#1c1a17"/>
<text x="52" y="118" font-family="Archivo, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#f7f4ec">ENGINE A. MANAGED YIELD OPS</text>
<text x="1348" y="118" font-family="Archivo, Inter, sans-serif" font-size="11" fill="#c9a227" text-anchor="end">score, outbound, manage, match, collect</text>
<rect x="40" y="140" width="420" height="150" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="140" width="4" height="150" rx="2" fill="#2e7d32"/>
<text x="56" y="164" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">A1. MASTER LEASE (principal)</text>
<text x="56" y="184" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Venture leases the parcel at fixed rent, sublets use-rights.</text>
<text x="56" y="202" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Takes the whole spread and the rent risk.</text>
<text x="56" y="220" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">No broker license: principal position, not agency.</text>
<rect x="480" y="140" width="420" height="150" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="480" y="140" width="4" height="150" rx="2" fill="#2e7d32"/>
<text x="496" y="164" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">A2. FLAT-FEE PLATFORM / SAAS</text>
<text x="496" y="184" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Owner subscribes to tooling, executes every lease itself.</text>
<text x="496" y="202" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Venture never negotiates, never takes a cut of rent.</text>
<text x="496" y="220" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">No broker license: tooling, not brokerage.</text>
<rect x="920" y="140" width="440" height="150" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="920" y="140" width="4" height="150" rx="2" fill="#8a6d00"/>
<text x="936" y="164" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">A3. BROKER-OF-RECORD AFFILIATION</text>
<text x="936" y="184" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Affiliate a licensed Michigan broker (and Indiana broker).</text>
<text x="936" y="202" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Commission leasing runs through them.</text>
<text x="936" y="220" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Week 4-8 conversation. A1 + A2 launch first.</text>
<rect x="40" y="320" width="1320" height="26" rx="4" fill="#1c1a17"/>
<text x="52" y="338" font-family="Archivo, Inter, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#f7f4ec">ENGINE B. YIELD INTELLIGENCE</text>
<text x="1348" y="338" font-family="Archivo, Inter, sans-serif" font-size="11" fill="#c9a227" text-anchor="end">the intelligence layer, sold to everyone holding idle land</text>
<rect x="40" y="360" width="420" height="130" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="360" width="4" height="130" rx="2" fill="#a67c00"/>
<text x="56" y="384" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">Land Yield Score</text>
<text x="56" y="404" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">SaaS seats for land investors.</text>
<text x="56" y="422" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Per-parcel scoring API.</text>
<text x="56" y="440" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Portfolio underwriting engagements.</text>
<rect x="480" y="360" width="420" height="130" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="480" y="360" width="4" height="130" rx="2" fill="#a67c00"/>
<text x="496" y="384" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">Demand heatmaps</text>
<text x="496" y="404" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Where laydown, storage, hunting,</text>
<text x="496" y="422" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">camping, apiary demand actually is.</text>
<text x="496" y="440" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Data licensing.</text>
<rect x="920" y="360" width="440" height="130" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="920" y="360" width="4" height="130" rx="2" fill="#a67c00"/>
<text x="936" y="384" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">The moat: realized_yield</text>
<text x="936" y="404" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Every lease A executes becomes</text>
<text x="936" y="422" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">training data B sells.</text>
<text x="936" y="440" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">scoring_snapshot_id joins prediction to reality.</text>
<rect x="40" y="520" width="640" height="150" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="40" y="520" width="4" height="150" rx="2" fill="#a67c00"/>
<text x="56" y="544" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">THE SCORE (v0.1.0, 39 TESTS PASSING)</text>
<text x="56" y="564" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">42 signals + 7 hard gates. Gates suppress use verticals, not discounts.</text>
<text x="56" y="582" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Every score carries score_version (lys-0.1.0), non-nullable.</text>
<text x="56" y="600" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Stacking conflict matrix (C/S/T/X) with drafting conditions.</text>
<rect x="720" y="520" width="640" height="150" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
<rect x="720" y="520" width="4" height="150" rx="2" fill="#b3261e"/>
<text x="736" y="544" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#b3261e">LANE A PILOT (90 DAYS, NOT RUN)</text>
<text x="736" y="564" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">LaPorte County. 500 mailers. Kill criteria at week 13 (any two fail):</text>
<text x="736" y="582" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">signed conversion below 2%; modeled-to-realized ratio below 0.6;</text>
<text x="736" y="600" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">demand-match below 50% within 60 days.</text>
<text x="40" y="710" font-family="Archivo, Inter, sans-serif" font-size="12.5" font-weight="700" fill="#b3261e">LICENSING CORRECTION: the 15-25% take-rate model is unlicensed brokerage in Michigan (MCL 339.2501, cited in thesis). Dead as specced.</text>
<text x="40" y="734" font-family="Archivo, Inter, sans-serif" font-size="12.5" font-weight="400" fill="#b3261e">LANE B: farm management firms and farmland funds (land banks and builders killed by the thesis's own research).</text>
<text x="40" y="770" font-family="Archivo, Inter, sans-serif" font-size="12.5" font-style="italic" fill="#6b655a">Figure D7. FALLOW yield stack. Name locked, no entity filed, LaPorte pilot not run. Live visual: neuruh-demos/fallow-yield/.</text>
</svg>