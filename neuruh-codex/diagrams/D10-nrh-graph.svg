<text x="736" y="444" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Vault Master-Data-List: 231 rows x 29 fields.</text>
<text x="736" y="462" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">11-Notion/: 942 files. Manifest: 33 sections.</text>
<text x="736" y="480" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Learnings: 217. Regression checks: 22/22 PASS.</text>
<text x="736" y="498" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Live visual: neuruh-demos/nrh-registry/ (Nov 10).</text>
