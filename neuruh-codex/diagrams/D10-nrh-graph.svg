<text x="56" y="424" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">HASH-CHAINED TRANSITION LOG</text>
<text x="56" y="444" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Every state change linked to the prior one.</text>
<text x="56" y="462" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">TX 0 -&gt; TX 1 -&gt; TX 2 -&gt; TX 3, each h(prev || state).</text>
<text x="56" y="480" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">SPEC RULE R2: strip NRH ID tokens before hashing.</text>
<text x="56" y="498" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Tamper-evident: a rewritten history recomputes everything.</text>
