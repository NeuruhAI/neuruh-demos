<text x="928" y="134" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">SEALED ROLL-UP</text>
<text x="928" y="154" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">50 results seal into a squad.</text>
<text x="928" y="172" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">20 squads seal into a cohort.</text>
<text x="928" y="190" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">7 cohorts seal into FINAL_OUTPUT.</text>
<text x="928" y="208" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Main ledger gets 11 records, not 6,487.</text>
<rect x="40" y="320" width="640" height="170" rx="6" fill="#fffdf7" stroke="#d8d2c4"/>
