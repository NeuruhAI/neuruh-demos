<text x="492" y="134" font-family="Archivo, Inter, sans-serif" font-size="14" font-weight="700" fill="#1c1a17">DISPATCH (THREAD POOL)</text>
<text x="492" y="154" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">6,487 opportunities scored in 3.3 seconds.</text>
<text x="492" y="172" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">0 failed. Tiers: A 208, B 1,452, C 4,793, gov-excluded 34.</text>
<text x="492" y="190" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Fault injection: 9,997 ok, 3 deliberate failures contained.</text>
<text x="492" y="208" font-family="Archivo, Inter, sans-serif" font-size="12.5" fill="#1c1a17">Crash resume produced byte-identical output.</text>
<line x1="876" y1="195" x2="912" y2="195" stroke="#a67c00" stroke-width="2"/>
<polygon points="904,190 904,200 912,195" fill="#a67c00"/>
